# EdgeDash user configuration
# Edit these values to match your profile and job search preferences.

target_role: "Security Engineer"
target_city: "Berlin"

keywords:
  - "security"
  - "data analyst"
  - "business intelligence"
  - "SQL"
  - "Python"
  - "power bi"
  - "tableau"

my_skills:
  - "security"
  - "Python"
  - "SQL"
  - "pandas"
  - "Excel"
  - "data visualisation"
  - "statistical analysis"

experience_years: 3

# Absolute or relative path to the SQLite database file.
db_path: "edgedash.db"

# Listings with a fit_score below this threshold are hidden from the dashboard.
min_fit_score: 60

# Which job sources to run. Each name must match a @register-ed Source class.
sources:
  - "arbeitnow"

# Set to true to use MockFetcher instead of the real Fetcher (offline dev mode).
use_mock_fetcher: false

# LLM provider: "gemini" or "ollama"
# gemini requires GEMINI_API_KEY in your .env file.
# ollama requires a local Ollama server (no key needed).
llm_provider: "gemini"
llm_model: "gemini-3.5-flash"

# ── SCORING ──────────────────────────────────────────────────────────────────
# Max listings scored per cycle (rule 21 — cost/rate-limit guard).
llm_batch_size: 25

# ── SCHEDULING ───────────────────────────────────────────────────────────────
# How many hours must pass before the Fetcher runs again.
fetch_interval_hours: 6
# Hard cap on pages and listings fetched in one cycle.
fetch_max_pages: 5
fetch_max_listings: 200
# Hard cap on seconds the Scorer and GapAnalyzer may run.
score_max_seconds: 300
analyse_max_seconds: 60

# Scoring weights — must sum to 1.0. Tune these without touching code.
# skill_match:   fraction of required skills present in my_skills profile.
# seniority_fit: how close the listing's seniority is to target_seniority.
# location_fit:  remote-ok / city match / unknown / elsewhere.
# recency:       how recently the listing was posted (decays over 30 days).
target_seniority: "mid"
weight_skill_match: 0.45
weight_seniority_fit: 0.25
weight_location_fit: 0.15
weight_recency: 0.15

# ── SKILL ALIASES ────────────────────────────────────────────────────────────
# This map is YOURS to edit. Adding entries is expected as you see your own data.
# Run `python -m edgedash.skills --audit` to find new collisions to add.
# Rule 23: every alias is explicit and human-approved — never auto-merged.
#
# Format:  "raw form": "canonical form"
# The canonical form (the value) is what ends up in gap reports and scoring.
# The raw forms (the keys) are whatever the extractor or you have seen in the wild.
skill_aliases:
  # Kubernetes and its managed flavours
  "k8s":  "kubernetes"
  "gke":  "kubernetes"

  # Cloud platforms — GCP is the canonical short form
  "google cloud platform": "gcp"
  "google cloud":          "gcp"

  # Node.js — kept SEPARATE from javascript; they are different skills
  "node":   "node.js"
  "nodejs": "node.js"

  # PostgreSQL spellings
  "postgresql": "postgres"
  "psql":       "postgres"

  # CI/CD spellings
  "ci cd": "ci/cd"
  "cicd":  "ci/cd"

  # Machine learning shorthand
  "ml": "machine learning"

  # Framework dot-normalisation
  "nestjs": "nest.js"
  "nextjs": "next.js"
