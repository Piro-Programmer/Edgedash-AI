name: EdgeDash Scheduled Cycle

# The Streamlit app is read-only by design: it renders whatever is already in
# the database and never runs agents. This workflow is the writer — without it
# the hosted Postgres stays empty and every panel shows an empty state.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL    the same Postgres connection string the Streamlit app uses
#   GEMINI_API_KEY  key for the LLM provider configured in config.yaml

on:
  schedule:
    # 00:30 UTC = 06:00 IST — one cycle each morning.
    - cron: '30 0 * * *'
  workflow_dispatch:

concurrency:
  # A cycle reads state, plans against the unscored backlog, then writes. A
  # manual dispatch landing on top of the scheduled run would plan against the
  # same backlog and score the same listings twice, burning Gemini quota.
  group: edgedash-cycle
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    # score_max_seconds alone allows 300s, and the LLM rate limiter backs off
    # for up to ~60s per retry on a quota hit. 10 minutes killed real cycles.
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify secrets are present
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set. storage.py falls back to a SQLite file on this runner, which is destroyed when the job ends — the run would report success while the hosted database stayed empty."
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is not set. The Scorer cannot extract facts without it."
            exit 1
          fi

      - name: Migrate database
        run: python -m edgedash.storage --migrate

      - name: Run EdgeDash cycle
        run: |
          set -e
          set -o pipefail
          python run_cycle.py | tee cycle.log

      - name: Report database contents
        if: always()
        run: python -m edgedash.storage --check | tee -a cycle.log

      - name: Upload cycle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-log
          path: cycle.log
          if-no-files-found: warn
          retention-days: 14
